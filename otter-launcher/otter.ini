[main]
shell=/usr/bin/fish
term=xterm-256color
font=Monocraft:style=Regular:size=12
font-bold=Monocraft:style=Bold:size=12
font-italic=Monocraft:style=Italic:size=12
font-bold-italic=Monocraft:style=Bold-Italic:size=12
line-height=17
pad=18x14
dpi-aware=no

[cursor]
style=beam
blink=no
beam-thickness=1.5

[mouse]
hide-when-typing=yes

[colors-dark]
blur=no
alpha=1.0
foreground=d8dee9
background=2e3440
cursor=2e3440 88c0d0
selection-foreground=2e3440
selection-background=88c0d0
urls=88c0d0

regular0=3b4252
regular1=bf616a
regular2=a3be8c
regular3=ebcb8b
regular4=81a1c1
regular5=b48ead
regular6=88c0d0
regular7=e5e9f0

bright0=4c566a
bright1=bf616a
bright2=a3be8c
bright3=ebcb8b
bright4=81a1c1
bright5=b48ead
bright6=8fbcbb
bright7=eceff4
